model:
  name: qwen
  params:
    # -------------------------------------------------------------------------
    # Backend selection
    #
    # Default backend is HuggingFace ("hf") for backward compatibility.
    # To use Unsloth, set backend: "unsloth" and use an Unsloth model repo id.
    # -------------------------------------------------------------------------
    #backend: "hf"
    #model_name: "Qwen/Qwen3-32B"
    device: "auto"
    #trust_remote_code: true

    # --- Optional: Unsloth backend (GPU/CUDA required) ---
    backend: "unsloth"
    model_name: "unsloth/qwen3-32b"
    load_in_4bit: false
    # dtype: null
    max_seq_length: 6000

    # full_finetuning: false
    # hf_token: "hf_..."  # only if using gated models

generation_config:
  name: default
  params:
    max_new_tokens: 6000
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0.0
    do_sample: true

profiling_prompt: |
  You are an expert user experience researcher. Your task is to analyze the following user description and generate a structured JSON profile based on it.

  **User Description:**
  "{description}"

  Based on this description, create a JSON object that captures the user's persona, their needs regarding coding tasks, and their preferences for the output.

  Your output MUST be a single, valid JSON object. Use the following structure and explanations as a guide.

  **JSON Template:**
  ```json
  {{
    "persona_description": "A one-sentence summary of the user's identity and primary goal. Stick to word choice and phrasing of the user description.",
    "input_dimensions": {{
      "task_complexity_gradient": List[float, float], # the range of task complexity the user is comfortable with between 0 and 1
      "real_world_context_embedding": string, # a label of the user's real-world context
      "persona_based_task_framing": string # a label of the user's persona and how they would frame a task
    }},
    "output_dimensions": {{
      "clarity_and_comprehensibility": int, # on a scale of 1 to 5, how clear and understandable is the user's output
      "efficiency": int, # on a scale of 1 to 5, how efficient is the user's output
      "expressive_style": string # a label of the user's expressive style
    }}
  }}
  ```

  Generate the JSON object now.

evaluation_prompts:
  judge_prompt: |
    You are an expert in evaluating programming code.
    You will be given a programming task and a model's output.
    Your task is to determine if the model's output is correct.


    Programming Task:
    ---
    {programming_task}
    ---

    Model's Output:
    ---
    {model_output}
    ---

    Instructions:
    1. Read the programming task and the model's output carefully.
    2. Determine if the model's output is correct.
    3. If the model's output is correct, output "correct".
    4. If the model's output is incorrect, output "incorrect".
    5. No extra keys, no trailing commas, no markdown fences, no commentary.

    Make sure to output only the string "correct" or "incorrect" and nothing else.
  answer_similarity_judge_prompt_output: |
    You are an expert in evaluating the similarity of two model code outputs.
    You will be given a task and two model code outputs.
    Your task is to determine how similar the two code outputs are.

    Task:
    ---
    {task}
    ---

    Model Code Output 1:
    ---
    {model_code_output_1}
    ---

    Model Code Output 2:
    ---
    {model_code_output_2}
    ---

    Instructions:
    1. Read the task and the two model code outputs carefully.
    2. Determine how similar the two code outputs are.
    3. If the two code outputs are similar, output "similar".
    4. If the two code outputs are not similar, output "not similar".
    5. No extra keys, no trailing commas, no markdown fences, no commentary.

    Make sure to output only the string "similar" or "not similar" and nothing else.

personalization_prompts:
  identify_changes: |
    You are an expert in personalizing programming tasks.

    Task:
    Given the following user profile, identify 2–3 concrete, distinct ways to modify a programming problem prompt for each field of the profile.
    The modifications should instruct how to adapt the prompt's phrasing, tone, and instructions to match the user's persona and preferences, without changing the core programming task. Don't refer to task_complexity_gradient. Only refer to the other fields in the user profile.

    User Profile:
    ---
    {user_profile_json}
    ---

    Instructions:
    1. Output must be a single valid JSON object. Do not include any explanations, comments, or markdown code fences.
    2. The JSON must match exactly this structure:
      - Root object has one key: "changes_by_field".
      - "changes_by_field" is an array of objects.
      - Each object has:
        * "field": a string, the user profile field name.
        * "options": an array of objects.
      - Each option object has exactly four string keys:
        * "name" (snake_case identifier),
        * "change" (short description of modification),
        * "example" (a concrete snippet),
        * "rationale" (why it fits the profile field).
    3. Keys must be exactly: changes_by_field, field, options, name, change, example, rationale.
      - Never output {{field (wrong)}} — always output "field".
      - No extra keys, no trailing commas.
    4. Use plain ASCII text in every JSON string value.
      - Never use LaTeX, backslashes, or escape sequences in examples.
      - Do not write things like \epsilon, \beta, \"quoted text\", or \n.
      - If needed, spell such content out with plain words instead.

    Correct Example (with two fields and two options each):

    {{
      "changes_by_field": [
        {{
          "field": "persona_description",
          "options": [
            {{
              "name": "student_friendly_tone",
              "change": "Use a conversational, student-like tone.",
              "example": "\\"Hey! Can you walk me through this question?\\"",
              "rationale": "Matches the user's beginner status."
            }},
            {{
              "name": "relatable_examples",
              "change": "Incorporate coursework-related examples.",
              "example": "\\"# Example: calculating the mean of exam scores.\\"",
              "rationale": "Connects with the user's academic context."
            }}
          ]
        }},
        {{
          "field": "output_dimensions.clarity_and_comprehensibility",
          "options": [
            {{
              "name": "verbose_comments",
              "change": "Ask to add comments explaining each line of code.",
              "example": "\\"Please add comments explaining each line of code.\\"",
              "rationale": "The user will want high clarity as a beginner."
            }},
            {{
              "name": "explanatory_prints",
              "change": "Ask to add print statements describing steps.",
              "example": "\\"Please add print statements describing steps.\\"",
              "rationale": "The user will want real-time explanations during execution as a beginner."
            }}
          ]
        }}
      ]
    }}

    Now, produce the JSON for all fields of the given user profile in exactly this format.

  compose_prompt: |
    You are an expert in rewriting programming tasks as a persona.
    You will be given an original programming problem prompt, the evaluation tests for the original prompt and a list of modifications to apply.
    Your task is to rewrite the prompt to incorporate all the specified changes while ensuring the underlying programming problem remains identical. Note that you are rewriting the prompt as the persona that requires the changes, so don't say it directly, but rather as if you are the persona.

    Original Prompt:
    ---
    {original_prompt}
    ---

    Evaluation Tests:
    ---
    {evaluation_tests}
    ---

    Modifications to apply:
    ---
    {changes_description}
    ---

    Instructions:
    1. Carefully read the original prompt and the list of changes.
    2. Rewrite the prompt to apply all changes cohesively.
    3. DO NOT alter the core requirements of the programming task. The new prompt must lead to the same solution.
    4. The new prompt must ask for a solution that passes all the evaluation tests. Make sure the varbiales types and basic logic requirements are the same as the original prompt.
    5. If a modification requires a change that will affect the evaluation tests, do not apply the modification.
    6. Ensure the output is a single, complete prompt.
    7. Do not answer the task or provide a solution to the task. 
    8. Rewrite the prompt as if you are the persona - always use first person pronouns like "I" and "my", and don't reffer to knowledge the persona doesn't have. 
    9. Never address the "user" in the prompt - you ARE the user when writing the prompt.
    10. Never reffer explicitly to external details that the persona doesn't know - nothing in the user profile outside "description", or more advanced programming concepts that the persona doesn't know.
    11. Your output MUST only contain the prompt text and nothing else.
      - No opening words or closing words
      - No explanations
      - No markdown fences

    Correct Example for modified_prompt:

    Input sample: "Write a function sum_list(nums) that returns the sum of a list of integers.

    "modified_prompt": "You are a Python tutor.\n\nTask: Write a function sum_list(nums) that returns the sum of a list of integers.\n\nRequirements:\n1) Input: a list of integers.\n2) Output: an integer sum.\n\nInstructions:\n- Use clear variable names and add brief inline comments.\n- Provide a small example at the end showing input and output."
  verify_prompt: |
    You are an expert in verifying programming problem statements.
    You will be given an original prompt and a modified version of it.
    Your task is to determine if the modified prompt preserves the original's core task and would result in the same ground-truth solution. Note that the modified prompt should perserve the original's task intent, and not to provide a solution or hints to the task.

    Original Prompt:
    ---
    {original_prompt}
    ---

    Modified Prompt:
    ---
    {modified_prompt}
    ---

    Instructions:
    1. Read both prompts carefully.
    2. Decide:
      - "same_end_goal": Is the fundamental task identical in both prompts?
      - "same_ground_truth": Would the correct solution for the modified prompt also be correct for the original prompt? Note that it's ok if the modified adds additional constraints or requirements, as long as the core task is the same and the solution will work for the original prompt as well.
    3. Output MUST be a single valid JSON object, nothing else.
    4. Use exactly these keys: same_end_goal, same_ground_truth, reason_if_failed.
      - Boolean values must be JSON booleans: true or false (lowercase).
      - If both booleans are true, set "reason_if_failed" to an empty string "".
      - If either boolean is false, provide a concise reason in "reason_if_failed".
    5. No extra keys, no trailing commas, no markdown fences, no commentary.

    Correct Examples:

    # Pass case (both true)
    {{
      "same_end_goal": true,
      "same_ground_truth": true,
      "reason_if_failed": ""
    }}

    # Fail case (ground truth differs)
    {{
      "same_end_goal": true,
      "same_ground_truth": false,
      "reason_if_failed": "Modified prompt changes input format, so the original correct solution would fail."
    }}

    Make sure to output only the JSON object and don't use too much thinking tokens.
simple_personalization_prompts:
  compose_prompt: |
    You are an expert in subtly adapting programming task prompts to match a user persona.
    You will be given an original programming problem prompt and a brief user persona summary.
    Your task is to make ONLY minimal phrasing adjustments to the prompt that subtly reflect the user's background or style.

    STRICT CONSTRAINTS:
    - The modified prompt must NOT be longer than the original by more than 3-4 words.
    - Do NOT add any new requirements, constraints, or instructions that were not in the original.
    - Do NOT add explanations, examples, or clarifications that were not in the original.
    - The modification should be limited to subtle word choice, phrasing, or contextual cues (e.g., adding "I need a function for my homework" for a student user).
    - It must contain at least one user-specific detail for that persona from the user context or workflow mentioned in the possible modifications, without adding any new requirements, constraints, or instructions.
    - The modified prompt should be human-like and natural, and not longer than the original beyond 3-4 words.
    - The core programming task and its solution MUST remain identical.

    User Persona Summary:
    ---
    {persona_summary}
    ---

    Possible modifications to apply (choose one):
    ---
    {changes_description}
    ---

    Original Prompt:
    ---
    {original_prompt}
    ---

    Instructions:
    1. Read the original prompt and the persona summary.
    2. Make only subtle phrasing changes (word substitutions, minor rewordings) that reflect the persona.
    3. Keep the prompt nearly identical in length and structure to the original.
    4. Do NOT add constraints, instructions, or any new content, including output format.
    5. Your output MUST be a single valid JSON object with exactly one key "modified_prompt".
    6. No extra keys, no trailing commas, no markdown fences, no commentary.

    Correct Examples:

    # novice user example
    Original: "Write a function sum_list(nums) that returns the sum of a list of integers."
    Persona: "A data science beginner learning Python"

    {{"modified_prompt": "Help me write a function sum_list(nums) for my stat course, it should return the sum of a list of integers."}}

    # advanced developer example
    Original: "Write a function sum_list(nums) that returns the sum of a list of integers."
    Persona: "An experienced developer"

    {{"modified_prompt": "Write a highly optimized function sum_list(nums) that returns the sum of a list of integers."}}

  compose_prompt_humaneval_plus: |
    You are an expert in subtly adapting programming task prompts to match a user persona.
    You will be given an original programming problem prompt and a brief user persona summary.
    Your task is to write a very short prefix (at most 3-4 words) that subtly reflects the user's persona. This prefix will be prepended to the original prompt.

    STRICT CONSTRAINTS:
    - The prefix must be at most 3-4 words.
    - Do NOT add more than one new requirement, constraint, or instruction.
    - The prefix should only provide a brief contextual cue consistent with the persona.
    - The core programming task and its solution MUST remain identical.

    User Persona Summary:
    ---
    {persona_summary}
    ---

    Original Prompt:
    ---
    {original_prompt}
    ---

    Instructions:
    1. Read the original prompt and the persona summary.
    2. Write a very short prefix (at most 3-4 words) that subtly reflects the persona.
    3. Do NOT add constraints, instructions, or any new content.
    4. Your output MUST be a single valid JSON object with exactly one key "modified_prompt" containing only the prefix text.
    5. No extra keys, no trailing commas, no markdown fences, no commentary.

    Correct Example for a Python beginner user:

    Original: "from typing import List\n\ndef has_close_elements(numbers: List[float], threshold: float) -> bool:\n    ..."

    {{"modified_prompt": "Help me understand this:"}}

  verify_prompt: |
    You are an expert in verifying programming problem statements.
    You will be given an original prompt and a modified version of it.
    Your task is to determine if the modified prompt preserves the original's core task, would result in the same ground-truth solution, and has NOT been significantly lengthened or had constraints added.

    Original Prompt:
    ---
    {original_prompt}
    ---

    Modified Prompt:
    ---
    {modified_prompt}
    ---

    Instructions:
    1. Read both prompts carefully.
    2. Decide:
      - "same_end_goal": Is the fundamental task identical in both prompts?
      - "same_ground_truth": Would the correct solution for the modified prompt also be correct for the original prompt?
    3. Additionally verify that the modified prompt does NOT add more than one new constraint, requirement, or instruction, and is not significantly longer than the original. If it does, set same_ground_truth to false.
    4. Output MUST be a single valid JSON object, nothing else.
    5. Use exactly these keys: same_end_goal, same_ground_truth, reason_if_failed.
      - Boolean values must be JSON booleans: true or false (lowercase).
      - If both booleans are true, set "reason_if_failed" to an empty string "".
      - If either boolean is false, provide a concise reason in "reason_if_failed".
    6. No extra keys, no trailing commas, no markdown fences, no commentary.

    Correct Examples:

    # Pass case (both true, minimal change)
    {{
      "same_end_goal": true,
      "same_ground_truth": true,
      "reason_if_failed": ""
    }}

    # Fail case (too many additions)
    {{
      "same_end_goal": true,
      "same_ground_truth": false,
      "reason_if_failed": "Modified prompt adds more than one new requirement, constraint, or instruction."
    }}
